<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PaySasa: send PayPal invoices, get paid, and pay your team from one sentence. Every payout waits for your OK." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b3d2c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
    />
    <title>PaySasa</title>
    <script>
      // Apply the saved theme and language before first paint, so nothing flashes.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("paysasa.settings.v1") || "{}");
          var t = s.theme || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (s.lang === "sw") document.documentElement.lang = "sw";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
