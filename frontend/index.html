<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PaySasa AI: invoicing, reconciliation and approved payouts for African freelancers." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>PaySasa AI</title>
    <script>
      // Apply the saved or system theme before first paint, so there's no flash of the wrong theme.
      (function () {
        try {
          var t = (JSON.parse(localStorage.getItem("paysasa.settings.v1") || "{}").theme) || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
